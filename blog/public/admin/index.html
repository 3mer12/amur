<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم — عامر_</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@700;800&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
.adm { padding-block: 2rem 4rem; }
.adm h1 { font-family: var(--font-head); font-size: 1.6rem; margin: 0 0 1.25rem; }
.adm label { display: block; font-weight: 600; margin: 1rem 0 0.35rem; }
.adm input[type=text], .adm input[type=email], .adm input[type=password], .adm input[type=date], .adm input[type=number], .adm textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 0.6rem 0.8rem;
}
.adm textarea { min-height: 22rem; line-height: 1.8; resize: vertical; }
.adm .ltr { direction: ltr; text-align: left; font-family: var(--font-mono); }
.adm button { font: inherit; cursor: pointer; border-radius: 6px; padding: 0.55rem 1.1rem; border: 1px solid var(--line); background: transparent; color: var(--fg); }
.adm button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.adm button.danger { border-color: #c0553b; color: #c0553b; }
.adm button:disabled { opacity: 0.5; cursor: default; }
.adm .row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.25rem; align-items: center; }
.adm .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.adm .tabs button[aria-pressed=true] { background: var(--chip); border-color: var(--bunn); font-weight: 600; }
.adm .items { list-style: none; margin: 1rem 0 0; padding: 0; border-top: 1px solid var(--line); }
.adm .items li { border-bottom: 1px solid var(--line); }
.adm .items button { display: flex; width: 100%; gap: 0.75rem; justify-content: space-between; align-items: baseline; text-align: start; border: 0; border-radius: 0; padding: 0.8rem 0.25rem; }
.adm .items small { color: var(--muted); direction: ltr; }
.adm .badge { background: var(--chip); padding: 0 0.5rem; border-radius: 4px; font-size: 0.85rem; margin-inline-start: 0.5rem; }
.adm .note { color: var(--muted); }
.adm .msg { margin-top: 1rem; min-height: 1.6rem; }
.adm .msg.err { color: #c0553b; }
.adm .msg.ok { color: var(--chroma); }
.adm .linkbtn { border: 0; padding: 0; text-decoration: underline; text-decoration-color: var(--chroma); }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="/" aria-label="عامر_"><img class="logo-img" src="/logo.jpg" alt="" width="44" height="44"><span class="logo-text"><span class="logo-word">عامر</span><span class="logo-cursor" aria-hidden="true"></span></span></a>
    <nav><button id="logout" class="linkbtn adm-logout" type="button" hidden>تسجيل الخروج</button></nav>
  </div>
</header>
<main class="wrap adm">

<section id="v-boot"><p class="note">جارٍ التحميل…</p></section>

<section id="v-setup" hidden>
  <h1>لم يكتمل الإعداد بعد</h1>
  <p>لوحة التحكم تحتاج أسرارًا تُضاف في Cloudflare، ولا تُكتب في كود الموقع. بعد إضافتها أعد نشر الموقع ثم حدّث هذه الصفحة.</p>
</section>

<section id="v-login" hidden>
  <h1>تسجيل الدخول</h1>
  <form id="login-form">
    <label for="l-email">البريد الإلكتروني</label>
    <input id="l-email" class="ltr" type="email" autocomplete="username" required>
    <label for="l-pass">كلمة السر</label>
    <input id="l-pass" class="ltr" type="password" autocomplete="current-password" required>
    <div class="row"><button class="primary" type="submit">دخول</button></div>
    <p id="l-msg" class="msg err" role="alert"></p>
  </form>
</section>

<section id="v-app" hidden>
  <div id="v-list">
    <h1>لوحة التحكم</h1>
    <p id="a-warn" class="msg err" hidden>مفتاح GitHub لم يُضبط بعد، فلن يعمل الحفظ.</p>
    <div class="tabs" role="group" aria-label="القسم">
      <button id="t-posts" type="button" aria-pressed="true">المقالات</button>
      <button id="t-pages" type="button" aria-pressed="false">الصفحات</button>
    </div>
    <button id="new-btn" class="primary" type="button">+ جديد</button>
    <ul id="items" class="items"></ul>
    <p id="list-msg" class="msg" role="status"></p>
  </div>

  <div id="v-edit" hidden>
    <h1 id="e-head">تحرير</h1>
    <label for="f-title">العنوان</label>
    <input id="f-title" type="text" required>
    <div id="r-slug"><label for="f-slug">الرابط المختصر (إنجليزي وأرقام وشرطات)</label><input id="f-slug" class="ltr" type="text" placeholder="my-first-post"></div>
    <div id="r-date"><label for="f-date">التاريخ</label><input id="f-date" class="ltr" type="date"></div>
    <div id="r-order"><label for="f-order">ترتيب الصفحة في القائمة (رقم)</label><input id="f-order" class="ltr" type="number" value="0"></div>
    <div id="r-desc"><label for="f-desc">وصف مختصر (اختياري)</label><input id="f-desc" type="text"></div>
    <div id="r-cover"><label for="f-cover">صورة الغلاف (تظهر قبل العنوان)</label><input id="f-cover" class="ltr" type="text" placeholder="/images/..."><div class="row"><input type="file" id="f-cover-file" accept="image/*" hidden><button id="cover-btn" type="button">+ رفع صورة الغلاف</button><button id="cover-clear" type="button">إزالة الغلاف</button></div></div>
    <div id="r-tags"><label for="f-tags">الوسوم (افصل بينها بفاصلة)</label><input id="f-tags" type="text"></div>
    <label for="f-body">المحتوى (Markdown)</label>
    <textarea id="f-body"></textarea>
    <div class="row">
      <label class="row" style="margin:0"><input type="file" id="f-img" accept="image/*" hidden><button id="img-btn" type="button">+ إدراج صورة</button></label>
      <label id="r-draft" style="margin:0;font-weight:400"><input id="f-draft" type="checkbox"> مسودة (لا تظهر في الموقع)</label>
    </div>
    <div class="row">
      <button id="save-btn" class="primary" type="button">حفظ</button>
      <button id="back-btn" type="button">رجوع</button>
      <button id="notify-btn" type="button">إشعار المشتركين</button>
      <button id="del-btn" class="danger" type="button">حذف</button>
    </div>
    <p id="e-msg" class="msg" role="status"></p>
  </div>
</section>

</main>
<script>
(function () {
  var ABOUT = "blog/content/about.md";
  var RESERVED = ["posts", "about", "admin", "api", "images", "404"];
  var state = { kind: "posts", cur: null };
  var $ = function (id) { return document.getElementById(id); };

  function show(name) {
    ["boot", "setup", "login", "app"].forEach(function (n) { $("v-" + n).hidden = n !== name; });
    $("logout").hidden = name !== "app";
  }
  function say(id, text, cls) { var el = $(id); el.textContent = text || ""; el.className = "msg" + (cls ? " " + cls : ""); }

  function api(path, opts) {
    opts = opts || {};
    var init = { method: opts.method || "GET", credentials: "same-origin", headers: {} };
    if (opts.body) { init.body = JSON.stringify(opts.body); init.headers["content-type"] = "application/json"; }
    return fetch("/api/" + path, init).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; });
    }).catch(function () { return { status: 0, error: "network" }; });
  }

  function boot() {
    api("me").then(function (j) {
      if (j.error === "setup") return show("setup");
      if (j.status === 401) return show("login");
      if (j.status !== 200) { show("login"); return say("l-msg", "تعذّر الاتصال بالخادم."); }
      $("a-warn").hidden = !!j.github;
      show("app");
      listView();
    });
  }

  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    say("l-msg", "");
    api("login", { method: "POST", body: { email: $("l-email").value, password: $("l-pass").value } }).then(function (j) {
      if (j.ok) { $("l-pass").value = ""; boot(); }
      else say("l-msg", j.status === 401 ? "البريد أو كلمة السر غير صحيحة." : "تعذّر تسجيل الدخول.");
    });
  });
  $("logout").addEventListener("click", function () { api("logout", { method: "POST" }).then(function () { show("login"); }); });

  /* ---------- القائمة ---------- */
  function setTab(kind) {
    state.kind = kind;
    $("t-posts").setAttribute("aria-pressed", kind === "posts");
    $("t-pages").setAttribute("aria-pressed", kind === "pages");
    loadList();
  }
  $("t-posts").addEventListener("click", function () { setTab("posts"); });
  $("t-pages").addEventListener("click", function () { setTab("pages"); });
  $("new-btn").addEventListener("click", function () { openNew(); });

  function listView() { $("v-edit").hidden = true; $("v-list").hidden = false; loadList(); }

  function loadList() {
    var ul = $("items");
    ul.textContent = "";
    say("list-msg", "جارٍ التحميل…");
    api("items?kind=" + state.kind).then(function (j) {
      if (j.status === 401) return show("login");
      if (j.status !== 200) return say("list-msg", "تعذّر تحميل القائمة.", "err");
      var items = j.items || [];
      if (state.kind === "pages") items.unshift({ path: ABOUT, title: "من أنا", name: "about.md" });
      say("list-msg", items.length ? "" : "لا يوجد شيء بعد.");
      items.forEach(function (it) {
        var li = document.createElement("li");
        var b = document.createElement("button");
        b.type = "button";
        var t = document.createElement("span");
        t.textContent = it.title || it.name;
        if (it.draft) { var d = document.createElement("span"); d.className = "badge"; d.textContent = "مسودة"; t.appendChild(d); }
        var s = document.createElement("small");
        s.textContent = it.date || "";
        b.appendChild(t); b.appendChild(s);
        b.addEventListener("click", function () { openItem(it.path); });
        li.appendChild(b);
        ul.appendChild(li);
      });
    });
  }

  /* ---------- المحرر ---------- */
  function parse(text) {
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
    var fm = {};
    if (!m) return { fm: fm, body: text };
    m[1].split(/\r?\n/).forEach(function (l) {
      var k = l.match(/^([A-Za-z_][\w-]*):\s*(.*)$/);
      if (!k) return;
      var v = k[2].trim();
      if ((v[0] === '"' && v[v.length - 1] === '"') || (v[0] === "'" && v[v.length - 1] === "'")) v = v.slice(1, -1);
      fm[k[1]] = v;
    });
    return { fm: fm, body: m[2].replace(/^\n+/, "") };
  }
  function build(fm, body) {
    var keys = ["title", "description", "date", "tags", "cover", "order", "draft"];
    Object.keys(fm).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
    var out = ["---"];
    keys.forEach(function (k) {
      var v = fm[k];
      if (v === undefined || v === null || v === "" || v === false) return;
      out.push(k + ": " + String(v).replace(/\s*[\r\n]+\s*/g, " "));
    });
    out.push("---", "", body.replace(/\s+$/, ""), "");
    return out.join("\n");
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

  function layoutFields() {
    var c = state.cur, about = c.path === ABOUT, posts = state.kind === "posts";
    $("r-slug").hidden = !c.isNew;
    $("r-date").hidden = about || !posts;
    $("r-tags").hidden = about || !posts;
    $("r-cover").hidden = about || !posts;
    $("notify-btn").hidden = about || !posts || c.isNew;
    $("r-order").hidden = about || posts;
    $("r-desc").hidden = about;
    $("r-draft").hidden = about;
    $("del-btn").hidden = c.isNew || about;
  }
  function fill() {
    var c = state.cur, fm = c.fm;
    $("e-head").textContent = c.isNew ? (state.kind === "posts" ? "مقال جديد" : "صفحة جديدة") : "تحرير";
    $("f-title").value = fm.title || "";
    $("f-slug").value = "";
    $("f-date").value = fm.date || today();
    $("f-order").value = fm.order || "0";
    $("f-desc").value = fm.description || "";
    $("f-tags").value = fm.tags || "";
    $("f-cover").value = fm.cover || "";
    $("f-draft").checked = fm.draft === "true";
    $("f-body").value = c.body || "";
    say("e-msg", "");
    layoutFields();
    $("v-list").hidden = true;
    $("v-edit").hidden = false;
    window.scrollTo(0, 0);
  }
  function openNew() { state.cur = { path: null, sha: null, fm: {}, body: "", isNew: true, slugTouched: false }; fill(); }
  function openItem(path) {
    say("list-msg", "جارٍ التحميل…");
    api("item?path=" + encodeURIComponent(path)).then(function (j) {
      if (j.status !== 200) return say("list-msg", "تعذّر فتح الملف.", "err");
      var p = parse(j.text);
      state.cur = { path: j.path, sha: j.sha, fm: p.fm, body: p.body, isNew: false };
      fill();
    });
  }
  $("back-btn").addEventListener("click", listView);

  function slugify(t) {
    var s = t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return s.length >= 3 ? s : "";
  }
  $("f-slug").addEventListener("input", function () { state.cur.slugTouched = true; });
  $("f-title").addEventListener("input", function () {
    if (state.cur && state.cur.isNew && !state.cur.slugTouched) $("f-slug").value = slugify($("f-title").value);
  });

  $("save-btn").addEventListener("click", function () {
    var c = state.cur, kind = state.kind, about = c.path === ABOUT, fm = c.fm;
    var title = $("f-title").value.trim();
    if (!title) return say("e-msg", "اكتب العنوان أولًا.", "err");
    fm.title = title;
    if (!about) {
      fm.description = $("f-desc").value.trim();
      fm.draft = $("f-draft").checked ? "true" : "";
      if (kind === "posts") { fm.date = $("f-date").value || today(); fm.tags = $("f-tags").value.trim(); fm.cover = $("f-cover").value.trim(); }
      else fm.order = $("f-order").value;
    }
    var path = c.path;
    if (c.isNew) {
      var slug = $("f-slug").value.trim().toLowerCase();
      if (!slug) slug = "post-" + Date.now().toString(36);
      if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)) return say("e-msg", "الرابط المختصر: حروف إنجليزية صغيرة وأرقام وشرطات فقط.", "err");
      if (kind === "pages" && RESERVED.indexOf(slug) >= 0) return say("e-msg", "هذا الاسم محجوز، اختر غيره.", "err");
      path = kind === "posts" ? "blog/content/posts/" + fm.date + "-" + slug + ".md" : "blog/content/pages/" + slug + ".md";
    }
    $("save-btn").disabled = true;
    say("e-msg", "جارٍ الحفظ…");
    api("item", { method: "POST", body: { path: path, sha: c.sha || undefined, text: build(fm, $("f-body").value) } }).then(function (j) {
      $("save-btn").disabled = false;
      if (j.status === 401) return show("login");
      if (j.ok) {
        c.path = path; c.sha = j.sha; c.isNew = false;
        layoutFields();
        say("e-msg", "تم الحفظ. سيظهر في الموقع خلال دقيقة تقريبًا.", "ok");
      } else if (j.status === 409) say("e-msg", "تعذّر الحفظ: الاسم مستخدم من قبل أو الملف تغيّر. ارجع وافتحه من جديد.", "err");
      else say("e-msg", "تعذّر الحفظ. تأكد من صلاحية مفتاح GitHub.", "err");
    });
  });

  $("del-btn").addEventListener("click", function () {
    var c = state.cur;
    if (!c || c.isNew || !confirm("حذف «" + ($("f-title").value || c.path) + "» نهائيًا؟")) return;
    api("item?path=" + encodeURIComponent(c.path) + "&sha=" + encodeURIComponent(c.sha), { method: "DELETE" }).then(function (j) {
      if (j.ok) { listView(); say("list-msg", "تم الحذف."); }
      else say("e-msg", "تعذّر الحذف.", "err");
    });
  });

  /* ---------- الصور ---------- */
  $("img-btn").addEventListener("click", function () { $("f-img").click(); });
  function encodeImage(file) {
    return new Promise(function (resolve, reject) {
      if (/gif$/.test(file.type)) {
        var fr = new FileReader();
        fr.onload = function () { resolve({ data: String(fr.result).split(",")[1], name: file.name }); };
        fr.onerror = reject;
        fr.readAsDataURL(file);
        return;
      }
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        var x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(u);
        resolve({ data: c.toDataURL("image/jpeg", 0.86).split(",")[1], name: file.name.replace(/\.\w+$/, "") + ".jpg" });
      };
      img.onerror = reject;
      img.src = u;
    });
  }
  $("f-img").addEventListener("change", function () {
    var f = this.files[0];
    this.value = "";
    if (!f) return;
    say("e-msg", "جارٍ رفع الصورة…");
    encodeImage(f).then(function (p) {
      return api("upload", { method: "POST", body: p });
    }).then(function (j) {
      if (!j.ok) return say("e-msg", "تعذّر رفع الصورة.", "err");
      var ta = $("f-body"), pos = ta.selectionStart || ta.value.length, md = "\n\n![](" + j.url + ")\n\n";
      ta.value = ta.value.slice(0, pos) + md + ta.value.slice(pos);
      say("e-msg", "أُدرجت الصورة في النص. اضغط «حفظ» لنشرها.", "ok");
    }).catch(function () { say("e-msg", "تعذّر قراءة الصورة.", "err"); });
  });

  /* ---------- صورة الغلاف ---------- */
  $("cover-btn").addEventListener("click", function () { $("f-cover-file").click(); });
  $("cover-clear").addEventListener("click", function () { $("f-cover").value = ""; });
  $("f-cover-file").addEventListener("change", function () {
    var f = this.files[0];
    this.value = "";
    if (!f) return;
    say("e-msg", "جارٍ رفع صورة الغلاف…");
    encodeImage(f).then(function (p) { return api("upload", { method: "POST", body: p }); }).then(function (j) {
      if (!j.ok) return say("e-msg", "تعذّر رفع الصورة.", "err");
      $("f-cover").value = j.url;
      say("e-msg", "رُفعت صورة الغلاف. اضغط «حفظ» لنشرها.", "ok");
    }).catch(function () { say("e-msg", "تعذّر قراءة الصورة.", "err"); });
  });

  /* ---------- إشعار المشتركين ---------- */
  $("notify-btn").addEventListener("click", function () {
    if (!confirm("إرسال إشعار «مقال جديد» لكل المشتركين الآن؟ تأكد أن المقال ظهر في الموقع أولًا.")) return;
    var btn = $("notify-btn"), sent = 0, removed = 0;
    btn.disabled = true;
    say("e-msg", "جارٍ إرسال الإشعارات…");
    function step(cursor) {
      return api("notify", { method: "POST", body: { cursor: cursor || undefined } }).then(function (j) {
        if (j.error === "kv") { say("e-msg", "لم يُربط مخزن الإشعارات (KV) في Cloudflare بعد.", "err"); return; }
        if (!j.ok) { say("e-msg", "تعذّر إرسال الإشعارات.", "err"); return; }
        sent += j.sent; removed += j.removed;
        if (!j.done && j.cursor) return step(j.cursor);
        say("e-msg", "أُرسل الإشعار إلى " + sent + " مشترك.", "ok");
      });
    }
    step(null).then(function () { btn.disabled = false; });
  });

  boot();
})();
</script>
</body>
</html>
